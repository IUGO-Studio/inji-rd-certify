name: Deploy Certify Service

on:
  push:
    branches:
      - main
    paths:
      - 'certify-service/**'
      - 'certify-core/**'
      - 'pom.xml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: 
      name: ${{ github.ref_name == 'main' && 'prod' || (github.ref_name == 'test' && 'qa' || 'develop') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "((MAJOR)|(BREAKING CHANGE))"
          minor_pattern: "((MINOR)|(feat:)|(feat\\())"
          patch_pattern: "((PATCH)|(fix:)|(fix\\())"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true

      - name: Log Version Information
        run: |
          echo "Generated Semantic Version: ${{ steps.semver.outputs.version }}"
          echo "Generated Version Tag: ${{ steps.semver.outputs.version_tag }}"
          echo "Major: ${{ steps.semver.outputs.major }}"
          echo "Minor: ${{ steps.semver.outputs.minor }}"
          echo "Patch: ${{ steps.semver.outputs.patch }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: 'access_token'
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: certify-service
          push: true
          tags: |
            us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/inji-certify:latest
            us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/inji-certify:${{ github.sha }}
            us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/inji-certify:${{ steps.semver.outputs.version }}
            us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/inji-certify:${{ steps.semver.outputs.version_tag }}

      - name: Create Git Tag (Main branch only)
        if: github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/tags/${{ steps.semver.outputs.version_tag }}',
                sha: context.sha
              });
              console.log('Successfully created tag ${{ steps.semver.outputs.version_tag }}');
            } catch (error) {
              console.log('Tag creation skipped or already exists:', error.message);
            }

      - name: 'Set up GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: 'k8s-inji-dev'
          location: 'us-central1-a'
    
      - name: Restart Kubernetes deployment
        run: |
          kubectl rollout restart deployment/inji-certify -n inji-certify
          kubectl rollout status deployment/inji-certify -n inji-certify --timeout=5m